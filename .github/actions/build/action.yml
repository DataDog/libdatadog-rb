name: Build libdatadog
description: Build libdatadog from source for the current platform

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
    - name: Install build dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update && apt-get install -y cmake autoconf automake libtool
        elif command -v apk >/dev/null 2>&1; then
          apk add --no-cache cmake autoconf automake libtool
        fi
    - name: Install build dependencies (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install cmake autoconf automake libtool
    - name: Build libdatadog
      shell: bash
      run: bundle exec rake libdatadog:build
