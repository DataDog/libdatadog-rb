issuer: https://token.actions.githubusercontent.com

# Caller: libdatadog's notify-downstreams-dispatch.yml on main, reached via
# workflow_run when the tag-push shim (notify-downstreams.yml) completes. The
# shim runs from the tagged commit and holds no permissions. See the workflow
# headers in DataDog/libdatadog for the trust chain.
#
# Grant: a job in notify-downstreams-dispatch.yml as it exists on libdatadog
# main mints a contents:write token on this repository to send one
# repository_dispatch. Whoever can merge upstream main controls that token.
# Upstream main carries the org rulesets and CODEOWNERS review. Same trust
# shape as self.lock-dependency in dd-trace-rb. If upstream main ever loses
# branch protection, ref_protected makes the mint fail loudly.

subject_pattern: "repo:DataDog/libdatadog:ref:refs/heads/main"

claim_pattern:
  event_name: workflow_run
  repository: DataDog/libdatadog
  job_workflow_ref: DataDog/libdatadog/\.github/workflows/notify-downstreams-dispatch\.yml@refs/heads/main
  ref_protected: "true"

permissions:
  contents: write
