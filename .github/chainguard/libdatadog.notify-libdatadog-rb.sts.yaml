issuer: https://token.actions.githubusercontent.com

# Caller: libdatadog's notify-libdatadog-rb workflow, triggered by pushing a
# `v<major>.<minor>.<patch>` release tag (libdd-* crates use prefixed tags).
#
# What this policy actually grants: anyone who can push a `v<major>.<minor>.<patch>`
# tag to DataDog/libdatadog (no tag protection covers them yet) can mint a
# contents:write token on this repository. The policy pins the workflow
# filename, not its implementation -- the workflow that runs comes from the
# tagged commit, so the token can be used for any repository-content
# operation, not only the dispatch. Branch protection on main and the
# rubygems.org environment bound the damage (no direct main push, no gem
# publish), but the grant itself is broader than the dispatch.
#
# To restrict minting to reviewed code, move the octo-sts step into a
# cross-repo reusable workflow pinned by commit SHA (same-repo reusable
# workflows do not help: they resolve from the caller's tree) and pin
# job_workflow_ref to that SHA here.
# Also add a ref_protected claim once tag protection rules cover release tags.
subject_pattern: 'repo:DataDog/libdatadog:ref:refs/tags/v\d+\.\d+\.\d+'

claim_pattern:
  event_name: push
  repository: DataDog/libdatadog
  job_workflow_ref: DataDog/libdatadog/\.github/workflows/notify-libdatadog-rb\.yml@refs/tags/.+

permissions:
  contents: write
