issuer: https://token.actions.githubusercontent.com

# Caller: libdatadog's notify-dispatch.yml workflow, dispatched with --ref
# main (normally by notify-libdatadog-rb.yml, the tag-push trigger). The
# tag-push shim runs from the tagged commit and holds no secrets. The
# octo-sts mint lives in notify-dispatch.yml on the default branch, and this
# policy pins that file to main. See the workflow headers in DataDog/
# libdatadog for the full trust chain.
#
# What this policy actually grants: a job defined in notify-dispatch.yml as
# it exists on libdatadog main mints a contents:write token on this
# repository, used to send one repository_dispatch. Whoever can merge PRs to
# upstream main can change what that token does. Upstream main carries the
# org's branch rulesets and CODEOWNERS review. This is the same trust shape
# as this repo's notify-consumers policy in dd-trace-rb. ref_protected
# additionally asserts the dispatch ran on a protected main. If upstream's
# branch rulesets ever disappear, mint fails loudly instead of trusting an
# unprotected main.
subject_pattern: "repo:DataDog/libdatadog:ref:refs/heads/main"

claim_pattern:
  event_name: workflow_dispatch
  repository: DataDog/libdatadog
  job_workflow_ref: DataDog/libdatadog/\.github/workflows/notify-dispatch\.yml@refs/heads/main
  ref_protected: "true"

permissions:
  contents: write
