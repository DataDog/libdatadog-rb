issuer: https://token.actions.githubusercontent.com

subject: repo:DataDog/libdatadog-rb:environment:rubygems.org

claim_pattern:
  event_name: workflow_dispatch
  environment: rubygems.org
  ref: refs/heads/[^/]+
  repository: DataDog/libdatadog-rb
  job_workflow_ref: DataDog/libdatadog-rb/\.github/workflows/build\.yml@refs/heads/[^/]+

permissions:
  contents: write
