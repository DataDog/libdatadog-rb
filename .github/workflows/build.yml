name: Build
on:
  workflow_call:
    inputs:
      push:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      push:
        description: Push gems to RubyGems.org
        required: true
        type: boolean
        default: false

permissions: {}

env:
  RUST_VERSION: "1.87.0"
  CMAKE_VERSION: "3.27.9"

jobs:
  # this is separate from `build-macos` because this uses docker
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ruby_platform: x86_64-linux
            base: ubuntu-24.04
            image: ghcr.io/datadog/images-rb/engines/ruby:4.0-centos-gcc
            rust_target: x86_64-unknown-linux-gnu
            rust_sha256: 1f6f18ce19387c42968a474cf175e67f99280614ded9c752d5d2e37af3204bcd
            cmake_arch: x86_64
            cmake_sha256: 72b01478eeb312bf1a0136208957784fe55a7b587f8d9f9142a7fc9b0b9e9a28
          - ruby_platform: x86_64-linux-musl
            base: ubuntu-24.04
            image: ghcr.io/datadog/images-rb/engines/ruby:4.0-musl-gcc
          - ruby_platform: aarch64-linux
            base: ubuntu-24.04-arm
            image: ghcr.io/datadog/images-rb/engines/ruby:4.0-centos-gcc
            rust_target: aarch64-unknown-linux-gnu
            rust_sha256: 2c66e31d774a0dcd4422db74584ebc6362ff3ae90c452caff9d2fb912c821e8d
            cmake_arch: aarch64
            cmake_sha256: 11bf3d30697df465cdf43664a9473a586f010c528376a966fd310a3a22082461
          - ruby_platform: aarch64-linux-musl
            base: ubuntu-24.04-arm
            image: ghcr.io/datadog/images-rb/engines/ruby:4.0-musl-gcc
    name: Build (${{ matrix.platform.ruby_platform }})
    runs-on: ${{ matrix.platform.base }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start container
        run: docker run --rm --detach --name build --volume "${PWD}:${PWD}" -w "${PWD}" ${{ matrix.platform.image }} sleep 86400
      - name: Install dependencies
        run: |
          docker exec build sh -c '
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache git cmake autoconf automake libtool curl yaml-dev linux-headers cargo
            elif command -v yum >/dev/null 2>&1; then
              yum install -y git autoconf automake libtool curl tar
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y git cmake autoconf automake libtool curl
            else
              echo "No supported package manager found" >&2
              exit 1
            fi
          '
      - name: Install CMake
        if: matrix.platform.cmake_sha256
        env:
          CMAKE_ARCH: ${{ matrix.platform.cmake_arch }}
          CMAKE_SHA256: ${{ matrix.platform.cmake_sha256 }}
        run: |
          docker exec --env CMAKE_VERSION --env CMAKE_ARCH --env CMAKE_SHA256 build sh -c '
            curl -fsSL -o /tmp/cmake.tar.gz "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-${CMAKE_ARCH}.tar.gz"
            echo "${CMAKE_SHA256}  /tmp/cmake.tar.gz" | sha256sum -c -
            rm -rf /opt/cmake
            mkdir -p /opt/cmake
            tar -xzf /tmp/cmake.tar.gz --strip-components=1 -C /opt/cmake
            /opt/cmake/bin/cmake --version
            rm /tmp/cmake.tar.gz
          '
      - name: Install Rust toolchain
        if: matrix.platform.rust_sha256
        env:
          RUST_TARGET: ${{ matrix.platform.rust_target }}
          RUST_SHA256: ${{ matrix.platform.rust_sha256 }}
        run: |
          docker exec --env RUST_VERSION --env RUST_TARGET --env RUST_SHA256 build sh -c '
            rust_tarball="rust-${RUST_VERSION}-${RUST_TARGET}.tar.gz"
            curl -fsSLO "https://static.rust-lang.org/dist/${rust_tarball}"
            echo "${RUST_SHA256}  ${rust_tarball}" | sha256sum -c -
            tar -xzf "${rust_tarball}"
            "./rust-${RUST_VERSION}-${RUST_TARGET}/install.sh" --prefix="${HOME}/.cargo" --components="rustc,cargo,clippy-preview,rustfmt-preview,rust-std-${RUST_TARGET}"
            rm -rf "${rust_tarball}" "rust-${RUST_VERSION}-${RUST_TARGET}"
          '
      - name: Build libdatadog
        run: |
          docker exec build sh -c '
            if [ -f /opt/rh/devtoolset-10/enable ]; then
              . /opt/rh/devtoolset-10/enable
            fi
            if [ -d /opt/cmake/bin ]; then
              export PATH="/opt/cmake/bin:${PATH}"
            fi
            export PATH="${HOME}/.cargo/bin:${PATH}"
            bundle install
            bundle exec rake libdatadog:build
          '
      - name: Stop container
        if: always()
        run: docker stop build || true
      - name: Tar vendor artifacts
        run: tar cf vendor-${{ matrix.platform.ruby_platform }}.tar vendor/
      - name: Upload vendor artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vendor-${{ matrix.platform.ruby_platform }}
          path: vendor-${{ matrix.platform.ruby_platform }}.tar

  # this is separate from `build-linux` because this doesn't use docker
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ruby_platform: arm64-darwin
            base: macos-15
            rust_target: aarch64-apple-darwin
            rust_sha256: 249496972e6f845f052036b9d7e73f816418412de2b266ec717b9050c1810dc3
    name: Build (${{ matrix.platform.ruby_platform }})
    runs-on: ${{ matrix.platform.base }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Install build dependencies
        run: brew install cmake autoconf automake libtool
      - name: Install Rust toolchain
        env:
          RUST_TARGET: ${{ matrix.platform.rust_target }}
          RUST_SHA256: ${{ matrix.platform.rust_sha256 }}
        run: |
          rust_tarball="rust-${RUST_VERSION}-${RUST_TARGET}.tar.gz"
          curl -fsSLO "https://static.rust-lang.org/dist/${rust_tarball}"
          echo "${RUST_SHA256}  ${rust_tarball}" | shasum -a 256 -c -
          tar -xzf "${rust_tarball}"
          "./rust-${RUST_VERSION}-${RUST_TARGET}/install.sh" --prefix="${HOME}/.cargo" --components="rustc,cargo,clippy-preview,rustfmt-preview,rust-std-${RUST_TARGET}"
          rm -rf "${rust_tarball}" "rust-${RUST_VERSION}-${RUST_TARGET}"
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
      - name: Build libdatadog
        run: bundle exec rake libdatadog:build
      - name: Tar vendor artifacts
        run: tar cf vendor-${{ matrix.platform.ruby_platform }}.tar vendor/
      - name: Upload vendor artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vendor-${{ matrix.platform.ruby_platform }}
          path: vendor-${{ matrix.platform.ruby_platform }}.tar

  package:
    strategy:
      fail-fast: false
      matrix:
        gem_platform:
          - x86_64-linux
          - aarch64-linux
          - arm64-darwin
          - ruby
    name: Package (${{ matrix.gem_platform }})
    needs: [build-linux, build-macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Download all vendor artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vendor-*
          merge-multiple: true
      - name: Extract vendor artifacts
        run: |
          for tarball in vendor-*.tar; do
            tar xf "${tarball}"
          done
      - name: Package gem
        run: bundle exec rake "gem:package[${{ matrix.gem_platform }}]"
      - name: Upload gem
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gem-${{ matrix.gem_platform }}
          path: pkg/*.gem

  validate-linux:
    strategy:
      fail-fast: false
      matrix:
        gem_source: [binary, ruby]
        platform:
          - ruby_platform: x86_64-linux
            gem_platform: x86_64-linux
            base: ubuntu-24.04
            image: ghcr.io/datadog/images-rb/engines/ruby:4.0-gnu-gcc
          - ruby_platform: x86_64-linux-musl
            gem_platform: x86_64-linux
            base: ubuntu-24.04
            image: ghcr.io/datadog/images-rb/engines/ruby:4.0-musl-gcc
          - ruby_platform: aarch64-linux
            gem_platform: aarch64-linux
            base: ubuntu-24.04-arm
            image: ghcr.io/datadog/images-rb/engines/ruby:4.0-gnu-gcc
          - ruby_platform: aarch64-linux-musl
            gem_platform: aarch64-linux
            base: ubuntu-24.04-arm
            image: ghcr.io/datadog/images-rb/engines/ruby:4.0-musl-gcc
    name: Validate (${{ matrix.platform.ruby_platform }}, ${{ matrix.gem_source }})
    needs: [package]
    runs-on: ${{ matrix.platform.base }}
    steps:
      - name: Download gem
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gem-${{ matrix.gem_source == 'ruby' && 'ruby' || matrix.platform.gem_platform }}
          path: pkg
      - name: Start container
        run: docker run --rm --detach --name validate --volume "${PWD}:${PWD}" -w "${PWD}" ${{ matrix.platform.image }} sleep 86400
      - name: Install gem
        run: docker exec validate gem install pkg/*.gem
      - name: Validate gem
        run: |
          docker exec validate ruby -e '
            require "libdatadog"
            puts "version:    #{Libdatadog::VERSION}"
            puts "platform:   #{RUBY_PLATFORM}"
            puts "binaries:   #{Libdatadog.available_binaries}"
            puts "pkgconfig:  #{Libdatadog.pkgconfig_folder}"
            puts "receiver:   #{Libdatadog.path_to_crashtracking_receiver_binary}"
            raise "pkgconfig_folder is nil" unless Libdatadog.pkgconfig_folder
            raise "crashtracking receiver not found" unless Libdatadog.path_to_crashtracking_receiver_binary
          '
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: spec/smoke
      - name: Smoke test (compile and run C program against libdatadog)
        run: docker exec validate ruby spec/smoke/run.rb
      - name: Stop container
        if: always()
        run: docker stop validate || true

  validate-macos:
    strategy:
      fail-fast: false
      matrix:
        gem_source: [binary, ruby]
        platform:
          - ruby_platform: arm64-darwin
            gem_platform: arm64-darwin
            base: macos-15
    name: Validate (${{ matrix.platform.ruby_platform }}, ${{ matrix.gem_source }})
    needs: [package]
    runs-on: ${{ matrix.platform.base }}
    steps:
      - uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          ruby-version: "4.0"
      - name: Download gem
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gem-${{ matrix.gem_source == 'ruby' && 'ruby' || matrix.platform.gem_platform }}
          path: pkg
      - name: Install gem
        run: gem install pkg/*.gem
      - name: Validate gem
        run: |
          ruby -e '
            require "libdatadog"
            puts "version:    #{Libdatadog::VERSION}"
            puts "platform:   #{RUBY_PLATFORM}"
            puts "binaries:   #{Libdatadog.available_binaries}"
            puts "pkgconfig:  #{Libdatadog.pkgconfig_folder}"
            puts "receiver:   #{Libdatadog.path_to_crashtracking_receiver_binary}"
            raise "pkgconfig_folder is nil" unless Libdatadog.pkgconfig_folder
            raise "crashtracking receiver not found" unless Libdatadog.path_to_crashtracking_receiver_binary
          '
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: spec/smoke
      - name: Smoke test (compile and run C program against libdatadog)
        run: ruby spec/smoke/run.rb

  publish:
    name: Publish
    if: inputs.push && github.ref == 'refs/heads/main'
    needs: [validate-linux, validate-macos]
    runs-on: ubuntu-24.04
    environment: rubygems.org
    concurrency: publish
    permissions:
      id-token: write # trusted-publishing OIDC exchange AND sigstore keyless signing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Download pre-built gems into pkg/
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gem-*
          merge-multiple: true
          path: pkg
      # Exchange the GitHub Actions OIDC token for a short-lived RubyGems API
      # key (trusted publishing) and expose it via GEM_HOST_API_KEY. This runs
      # on the host; the key is passed into the container below.
      - uses: rubygems/configure-rubygems-credentials@bc6dd217f8a4f919d6835fcfefd470ef821f5c44 # v1.0.0
      # Run the gem tooling inside a pinned, runtime-only image rather than on
      # the host. The workspace is mounted at the same path so the vendored
      # patch and the pkg/ gems resolve identically inside the container.
      - name: Start container
        run: docker run --rm --detach --name publish --volume "${PWD}:${PWD}" -w "${PWD}" ghcr.io/datadog/images-rb/engines/ruby:4.0-musl sleep 86400
      - name: Install pinned publishing tools
        run: |
          docker exec publish sh -c '
            gem install sigstore-cli -v 0.2.3
            gem install rubygems-await -v 0.5.4
          '
      - name: Push gems with attestation
        # The patch makes `gem push` sign each gem with sigstore-cli and attach
        # the attestation to the upload. GEM_HOST_API_KEY authorizes the push;
        # the ACTIONS_ID_TOKEN_REQUEST_* vars let sigstore-cli mint its OIDC
        # signing identity from inside the container.
        run: |
          docker exec \
            --env GEM_HOST_API_KEY \
            --env ACTIONS_ID_TOKEN_REQUEST_URL \
            --env ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            --env RUBYOPT="-r${PWD}/.github/scripts/rubygems-attestation-patch.rb" \
            publish sh -c '
              export PATH="$(ruby -e "print Gem.bindir"):$PATH"
              for gem in pkg/*.gem; do gem push "$gem"; done
            '
      - name: Wait for the gems to be available on RubyGems.org
        run: |
          docker exec publish sh -c '
            export PATH="$(ruby -e "print Gem.bindir"):$PATH"
            rubygems-await pkg/*.gem
          '
      - name: Stop container
        if: always()
        run: docker stop publish || true
