name: Build
on:
  workflow_call:
  workflow_dispatch:

env:
  RUSTUP_VERSION: "1.29.0"

jobs:
  # this is separate from `build-macos` because this uses docker
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ruby_platform: x86_64-linux
            base: ubuntu-24.04
            image: ghcr.io/datadog/images-rb/engines/ruby:4.0-gnu-gcc
            rust_target: x86_64-unknown-linux-gnu
            rustup_sha256: 4acc9acc76d5079515b46346a485974457b5a79893cfb01112423c89aeb5aa10
          - ruby_platform: x86_64-linux-musl
            base: ubuntu-24.04
            image: ghcr.io/datadog/images-rb/engines/ruby:4.0-musl-gcc
          - ruby_platform: aarch64-linux
            base: ubuntu-24.04-arm
            image: ghcr.io/datadog/images-rb/engines/ruby:4.0-gnu-gcc
            rust_target: aarch64-unknown-linux-gnu
            rustup_sha256: 9732d6c5e2a098d3521fca8145d826ae0aaa067ef2385ead08e6feac88fa5792
          - ruby_platform: aarch64-linux-musl
            base: ubuntu-24.04-arm
            image: ghcr.io/datadog/images-rb/engines/ruby:4.0-musl-gcc
    name: Build (${{ matrix.platform.ruby_platform }})
    runs-on: ${{ matrix.platform.base }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start container
        run: docker run --rm --detach --name build --volume "${PWD}:${PWD}" -w "${PWD}" ${{ matrix.platform.image }} sleep 86400
      - name: Install dependencies
        run: |
          docker exec build sh -c '
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache git cmake autoconf automake libtool curl yaml-dev cargo
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y git cmake autoconf automake libtool curl
            fi
          '
      - name: Install Rust toolchain via rustup
        if: matrix.platform.rustup_sha256
        env:
          RUST_TARGET: ${{ matrix.platform.rust_target }}
          RUSTUP_SHA256: ${{ matrix.platform.rustup_sha256 }}
        run: |
          docker exec build sh -c "
            curl -sSfO https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/${RUST_TARGET}/rustup-init
            echo \"${RUSTUP_SHA256}  rustup-init\" | sha256sum -c -
            chmod +x rustup-init
            ./rustup-init -y --default-toolchain stable
            rm rustup-init
          "
      - name: Build libdatadog
        run: |
          docker exec build sh -c '
            export PATH="${HOME}/.cargo/bin:${PATH}"
            bundle install
            bundle exec rake libdatadog:build
          '
      - name: Stop container
        if: always()
        run: docker stop build || true
      - name: Tar vendor artifacts
        run: tar cf vendor-${{ matrix.platform.ruby_platform }}.tar vendor/
      - name: Upload vendor artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vendor-${{ matrix.platform.ruby_platform }}
          path: vendor-${{ matrix.platform.ruby_platform }}.tar

  # this is separate from `build-linux` because this doesn't use docker
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ruby_platform: arm64-darwin
            base: macos-15
            rust_target: aarch64-apple-darwin
            rustup_sha256: aeb4105778ca1bd3c6b0e75768f581c656633cd51368fa61289b6a71696ac7e1
    name: Build (${{ matrix.platform.ruby_platform }})
    runs-on: ${{ matrix.platform.base }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ruby/setup-ruby@7372622e62b60b3cb750dcd2b9e32c247ffec26a # v1.302.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Install build dependencies
        run: brew install cmake autoconf automake libtool
      - name: Install Rust toolchain
        env:
          RUST_TARGET: ${{ matrix.platform.rust_target }}
          RUSTUP_SHA256: ${{ matrix.platform.rustup_sha256 }}
        run: |
          curl -sSfO "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/${RUST_TARGET}/rustup-init"
          echo "${RUSTUP_SHA256}  rustup-init" | shasum -a 256 -c -
          chmod +x rustup-init
          ./rustup-init -y --default-toolchain stable
          rm rustup-init
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
      - name: Build libdatadog
        run: bundle exec rake libdatadog:build
      - name: Tar vendor artifacts
        run: tar cf vendor-${{ matrix.platform.ruby_platform }}.tar vendor/
      - name: Upload vendor artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vendor-${{ matrix.platform.ruby_platform }}
          path: vendor-${{ matrix.platform.ruby_platform }}.tar

  package:
    name: Package
    needs: [build-linux, build-macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ruby/setup-ruby@7372622e62b60b3cb750dcd2b9e32c247ffec26a # v1.302.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Download all vendor artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vendor-*
          merge-multiple: true
      - name: Extract vendor artifacts
        run: |
          for tarball in vendor-*.tar; do
            tar xf "${tarball}"
          done
      - name: Package gems
        run: bundle exec rake package
      - name: Upload gems
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gems
          path: pkg/*.gem
