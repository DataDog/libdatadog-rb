name: Publish
on: workflow_dispatch

concurrency: "publish" # Only one publish job at a time

jobs:
  publish-ruby:
    name: Build and push gem to RubyGems.org
    runs-on: ubuntu-24.04
    environment: "rubygems.org" # see: https://github.com/DataDog/libdatadog-rb/settings/environments
    permissions:
      id-token: write # Required for trusted publishing, see https://github.com/rubygems/release-gem
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # 1.310.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Install dependencies
        run: bundle install
      - name: Fetch and extract prebuilt releases
        run: bundle exec rake extract
      - name: Package gems
        run: bundle exec rake package
      - uses: rubygems/release-gem@6317d8d1f7e28c24d28f6eff169ea854948bd9f7 # v1.2.0
