name: Update from libdatadog

# A libdatadog crate release (plain `v*` tag push on DataDog/libdatadog)
# sends `libdatadog-released`, which starts this workflow. It bumps
# LIB_VERSION in lib/libdatadog/version.rb and opens a draft PR. The main.yml
# CI on that PR builds libdatadog from the new tag and validates it.

on: # yamllint disable-line rule:truthy
  repository_dispatch:
    types: [libdatadog-released]

# Per-version group: a queued run for the same version replaces a pending
# one, without cancelling a run already in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.version }}
  cancel-in-progress: false

# Default permissions for all jobs
permissions: {}

jobs:
  update-from-libdatadog:
    name: "Update libdatadog to ${{ github.event.client_payload.version }}"
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    env:
      VERSION: ${{ github.event.client_payload.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # libdatadog's notify workflow sends the dispatch over an octo-sts
      # trust policy. Still validate the payload before writing anything.
      - name: Validate dispatched version
        id: check
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid libdatadog version dispatched: '$VERSION'"
            exit 1
          fi
          CURRENT=$(ruby -e 'require "./lib/libdatadog/version"; print Libdatadog::LIB_VERSION')
          echo "Current LIB_VERSION: $CURRENT, dispatched: $VERSION"
          if [ "$VERSION" = "$CURRENT" ]; then
            echo "LIB_VERSION already at $CURRENT; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Only LIB_VERSION moves on an upstream bump: the gem version scheme
      # (lib_version.gem_major.gem_minor) keeps its own counters, and past
      # bumps like 45.0.0 -> 46.0.0 touched this line alone.
      - name: Bump LIB_VERSION to ${{ env.VERSION }}
        if: steps.check.outputs.skip != 'true'
        run: sed -i "s/^  LIB_VERSION = \".*\"/  LIB_VERSION = \"${VERSION}\"/" lib/libdatadog/version.rb

      - name: Show diff
        if: steps.check.outputs.skip != 'true'
        run: git diff --color=always

      - name: Get GitHub Token via dd-octo-sts
        id: generate-token
        if: steps.check.outputs.skip != 'true'
        uses: DataDog/dd-octo-sts-action@96a25462dbcb10ebf0bfd6e2ccc917d2ab235b9a # v1.0.4
        with:
          scope: DataDog/libdatadog-rb
          policy: self.update-from-libdatadog

      # There appears to be a race condition in token propagation, wait it out
      - name: Wait for token propagation
        if: steps.check.outputs.skip != 'true'
        run: sleep 30

      - name: Create Pull Request
        if: steps.check.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          branch: auto-generate/update-libdatadog
          title: "Update libdatadog to ${{ env.VERSION }}"
          base: main
          draft: true
          delete-branch: true
          sign-commits: true
          commit-message: "build: update libdatadog to ${{ env.VERSION }}"
          add-paths: lib/libdatadog/version.rb
          body: |
            ### Why

            A libdatadog release was tagged upstream, and LIB_VERSION pins this repo's build of it.

            ### What

            Bumps `LIB_VERSION` to `${{ env.VERSION }}`. Only that line moves; the gem version counters keep their own scheme.

            ### Risk

            Two-way door, version pin. Revert restores the previous LIB_VERSION.

            ### Notes

            CI on this PR builds libdatadog from the new tag. If the build fails right after the upstream tag lands, the `libdd-*` crates it depends on may not be on crates.io yet; re-run the failed job once they are.

            Merging is not a release: dispatch the Build workflow (push=false to validate, push=true to publish). dd-trace-rb then picks the new gem up automatically via its update-internal-deps workflow.

            ### Details

            <details><summary>Automation</summary>

            _Auto-generated by [update-from-libdatadog](${{ github.server_url }}/${{ github.repository }}/blob/main/.github/workflows/update-from-libdatadog.yml)._

            - Triggered by: ${{ github.event.client_payload.triggered_by || 'unknown' }}
            - Source run: ${{ github.event.client_payload.source_run_url || 'not provided' }}

            </details>
